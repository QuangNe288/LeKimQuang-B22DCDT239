<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Nhiệm Vụ Của Phương Anh 🌟</title>
    <!-- Font chữ -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --bg-color: #fce4ec; --card-bg: #ffffff; --text-color: #4a4a4a; --primary-color: #ff8a80; --check-color: #00bfa5; }
        body { font-family: 'Nunito', sans-serif; background-color: var(--bg-color); background-image: radial-gradient(#ffcdd2 2px, transparent 2px); background-size: 30px 30px; color: var(--text-color); display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
        .container { background-color: var(--card-bg); width: 100%; max-width: 600px; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(255, 138, 128, 0.2); text-align: center; position: relative; z-index: 1; }
        
        h1 { color: var(--primary-color); font-size: 28px; margin-bottom: 5px; }
        p.subtitle { color: #888; font-size: 16px; margin-bottom: 25px; }

        /* KHU VỰC THÊM/XÓA CỦA GIÁO VIÊN (Chỉ hiện khi có ?admin=1) */
        .input-section { display: none; gap: 10px; margin-bottom: 25px; }
        .delete-btn { display: none; margin-left: auto; background: none; border: none; font-size: 20px; cursor: pointer; color: #ff8a80; transition: 0.3s; }
        
        .teacher-mode .input-section { display: flex; }
        .teacher-mode .delete-btn { display: inline-block; }

        input[type="text"].task-input { flex: 1; padding: 12px 20px; border: 2px solid #ffcdd2; border-radius: 15px; font-size: 16px; font-family: 'Nunito', sans-serif; outline: none; transition: 0.3s; }
        button.add-btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 25px; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        ul { list-style: none; padding: 0; margin: 0; }
        li { background-color: #f9fbe7; margin-bottom: 15px; padding: 15px 20px; border-radius: 15px; display: flex; align-items: center; flex-wrap: wrap; font-size: 18px; font-weight: 600; transition: 0.3s; }
        input[type="checkbox"] { width: 24px; height: 24px; margin-right: 15px; accent-color: var(--check-color); cursor: pointer; }
        
        /* Ô nhập lý do */
        .reason-input { width: 100%; margin-top: 10px; padding: 8px 15px; border: 1px dashed #ccc; border-radius: 10px; font-size: 14px; font-family: 'Nunito', sans-serif; outline: none; }
        .reason-input:focus { border-color: var(--check-color); }
        
        li.completed { background-color: #e0f2f1; color: #9e9e9e; }
        li.completed .task-text { text-decoration: line-through; opacity: 0.7; }

        /* Bảng thống kê nộp bài dành cho giáo viên */
        .teacher-stats { background: #fff3e0; border: 2px solid #ffe0b2; padding: 15px; border-radius: 15px; margin-bottom: 25px; text-align: left; display: none; }
        .teacher-mode .teacher-stats { display: block; }
        .teacher-stats h3 { margin: 0 0 10px 0; color: #f57c00; font-size: 18px; }
        .teacher-stats p { margin: 5px 0; font-size: 15px; color: #555; }

        /* Nút gửi */
        .send-btn { background-color: #4CAF50; color: white; border: none; padding: 15px 30px; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; font-family: 'Nunito', sans-serif; }
        .send-btn:disabled { background-color: #cccccc; cursor: not-allowed; opacity: 0.7; }
        .send-btn:not(:disabled):hover { background-color: #45a049; transform: translateY(-2px); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 40px; border-radius: 25px; text-align: center; max-width: 350px; }
        .modal-content h2 { color: #ff5252; margin-top: 0; }
        .close-modal-btn { background-color: var(--check-color); color: white; border: none; padding: 12px 30px; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="pageTitle">✨ Bảng Nhiệm Vụ Của Phương Anh ✨</h1>
        <p class="subtitle" id="statusText">Cố gắng hoàn thành thật tốt nhé!</p>

        <!-- THỐNG KÊ DÀNH RIÊNG CHO GIÁO VIÊN -->
        <div class="teacher-stats" id="teacherStatsBox">
            <h3>📊 Thống kê bài nộp của Phương Anh:</h3>
            <p id="submitStatus"><b>Trạng thái:</b> Chưa nộp bài</p>
            <p id="submitCount"><b>Số lần nộp:</b> 0 lần</p>
            <p id="submitTime"><b>Thời gian nộp gần nhất:</b> Chưa có</p>
        </div>

        <!-- Ô GIAO VIỆC -->
        <div class="input-section">
            <input type="text" id="taskInput" class="task-input" placeholder="Thêm nhiệm vụ cho Phương Anh..." onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addTask()">Giao việc</button>
        </div>

        <ul id="taskList">
            <!-- Dữ liệu hiển thị ở đây -->
        </ul>
        
        <!-- Nút Gửi bài của học sinh -->
        <button id="submitBtn" class="send-btn" onclick="sendToTeacher()" disabled>Gửi bài cho giáo viên 🚀</button>
    </div>

    <!-- Hộp thoại -->
    <div class="modal" id="congratsModal">
        <div class="modal-content">
            <h2>Nộp bài thành công! 🎉</h2>
            <p>Bài làm và lý do của Phương Anh đã được gửi tới cô giáo!</p>
            <button class="close-modal-btn" onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // ĐIỀN MÃ FIREBASE CỦA BẠN VÀO ĐÂY
        // =========================================================================
        const firebaseConfig = {
             apiKey: "AIzaSyBASXjlpn_U81L7C6CtvvpPB_KfbXuO_IA",
  authDomain: "quanlihocsinh-e29bd.firebaseapp.com",
  databaseURL: "https://quanlihocsinh-e29bd-default-rtdb.firebaseio.com",
  projectId: "quanlihocsinh-e29bd",
  storageBucket: "quanlihocsinh-e29bd.firebasestorage.app",
  messagingSenderId: "1011350811634",
  appId: "1:1011350811634:web:70fe410edb1dab888d316b",
  measurementId: "G-1ER2DQQF95"
        };
        // =========================================================================

        const urlParams = new URLSearchParams(window.location.search);
        const isTeacher = urlParams.get('admin') === '1';

        if (isTeacher) {
            document.body.classList.add('teacher-mode');
            document.getElementById('pageTitle').innerText = "👨‍🏫 Quản Lý Bài Của Phương Anh";
            document.getElementById('statusText').innerText = "Chế độ Giáo viên";
            document.getElementById('submitBtn').style.display = 'none';
        }

        if (firebaseConfig.apiKey !== "BẠN_ĐIỀN_API_KEY_CỦA_BẠN_ĐÂY") {
            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();
            var tasksRef = database.ref('phuong-anh/nhiem-vu');
            var metaRef = database.ref('phuong-anh/thong-tin-nop');

            // Lắng nghe dữ liệu nhiệm vụ
            tasksRef.on('value', (snapshot) => {
                const data = snapshot.val();
                const ul = document.getElementById("taskList");
                ul.innerHTML = ''; 
                let completedCount = 0;

                if (data) {
                    Object.keys(data).forEach(taskId => {
                        const task = data[taskId];
                        if (task.completed) completedCount++;

                        const li = document.createElement("li");
                        if (task.completed) li.classList.add("completed");
                        
                        li.innerHTML = `
                            <div style="display: flex; align-items: center; width: 100%;">
                                <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${taskId}', this.checked)">
                                <span class="task-text">${task.text}</span>
                                <button class="delete-btn" onclick="deleteTask('${taskId}')">✖</button>
                            </div>
                            <input type="text" class="reason-input" placeholder="Lý do/Ghi chú của Phương Anh..." value="${task.reason || ''}" onchange="updateReason('${taskId}', this.value)">
                        `;
                        ul.appendChild(li);
                    });
                }

                if (!isTeacher) {
                    const submitBtn = document.getElementById('submitBtn');
                    if (completedCount > 0) {
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Gửi bài cho giáo viên 🚀";
                    } else {
                        submitBtn.disabled = true;
                        submitBtn.innerText = "Hãy tích hoàn thành ít nhất 1 nhiệm vụ để nộp bài";
                    }
                }
            });

            // Lắng nghe thông tin nộp bài (Hiển thị cho giáo viên)
            metaRef.on('value', (snapshot) => {
                const meta = snapshot.val();
                if (meta) {
                    document.getElementById('submitStatus').innerHTML = `<b>Trạng thái:</b> <span style="color: green;">Đã nộp bài ✅</span>`;
                    document.getElementById('submitCount').innerHTML = `<b>Số lần nộp:</b> ${meta.count || 0} lần`;
                    document.getElementById('submitTime').innerHTML = `<b>Thời gian nộp gần nhất:</b> ${meta.lastTime || 'Chưa có'}`;
                }
            });
        }

        // CÁC HÀM XỬ LÝ
        window.addTask = function() {
            if (!isTeacher) return;
            let input = document.getElementById("taskInput");
            if (input.value.trim() === "") return alert("Chưa nhập nhiệm vụ!");
            tasksRef.push({ text: input.value.trim(), completed: false, reason: "" });
            input.value = ""; 
        };

        window.handleKeyPress = function(event) { if (event.key === "Enter") window.addTask(); };
        window.toggleTask = function(taskId, isChecked) { if (tasksRef) tasksRef.child(taskId).update({ completed: isChecked }); };
        window.updateReason = function(taskId, reasonText) { if (tasksRef) tasksRef.child(taskId).update({ reason: reasonText }); };
        window.deleteTask = function(taskId) { if (isTeacher && tasksRef) tasksRef.child(taskId).remove(); };

        // Xử lý khi Phương Anh bấm Gửi bài
        window.sendToTeacher = function() {
            const now = new Date();
            const timeString = now.toLocaleDateString('vi-VN') + ' lúc ' + now.toLocaleTimeString('vi-VN');

            // Đọc số lần nộp hiện tại rồi cộng thêm 1
            database.ref('phuong-anh/thong-tin-nop').once('value').then((snapshot) => {
                const currentData = snapshot.val() || { count: 0 };
                const newCount = currentData.count + 1;

                // Lưu lại lịch sử lên Firebase
                database.ref('phuong-anh/thong-tin-nop').set({
                    count: newCount,
                    lastTime: timeString
                });
            });

            shootConfetti();
            document.getElementById('congratsModal').style.display = 'flex';
        };

        function shootConfetti() {
            let duration = 3 * 1000, animationEnd = Date.now() + duration;
            let defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
            let interval = setInterval(function() {
                if (Date.now() > animationEnd) return clearInterval(interval);
                confetti(Object.assign({}, defaults, { particleCount: 50, origin: { x: 0.2, y: 0.8 } }));
                confetti(Object.assign({}, defaults, { particleCount: 50, origin: { x: 0.8, y: 0.8 } }));
            }, 250);
        }

        window.closeModal = function() { document.getElementById('congratsModal').style.display = 'none'; };
    </script>
</body>
</html>
